# MeetMind Capture V1 子域名部署配置
# 假定子域名: capture.meetmind.online
# 应用端口: 3002
# 复制此文件到 /etc/nginx/conf.d/capture.meetmind.online.conf

map $http_upgrade $meetmind_capture_connection_upgrade {
    default upgrade;
    '' close;
}

upstream meetmind_capture_backend {
    server 127.0.0.1:3002;
    keepalive 32;
}

server {
    listen 80;
    server_name capture.meetmind.online;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name capture.meetmind.online;

    ssl_certificate /etc/letsencrypt/live/capture.meetmind.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capture.meetmind.online/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 500M;

    # Service Worker 必须走 no-store，避免旧离线回退脚本在浏览器中长期驻留。
    location = /sw.js {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
        access_log off;
    }

    # 明确提供 favicon.ico，避免旧 Service Worker 追随 /favicon.ico 重定向失败。
    location = /favicon.ico {
        root /mnt/meetmind-capture-v1-server-handoff/public;
        default_type image/x-icon;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # 微信公众平台域名验证文件
    location = /MP_verify_ExSNqR1XrzWveNzz.txt {
        root /mnt/meetmind-capture-v1-server-handoff/public;
        default_type text/plain;
    }

    location /api/asr-stream {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api/tutor-call {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api/tutor {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/chat {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /api/video/import {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 900s;
    }

    # 档位2：跨设备录音音频持久化上传（大文件，需大 body + 长超时）
    location /api/workspace/upload-audio {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 900s;
    }

    location /api/apps/execute {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }

    location /api/transcribe-turbo {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }

    # /api/transcribe: 长音频异步转写（DashScope qwen3-asr-flash-filetrans）
    # 100 分钟音频需要 10-30 分钟完成，必须长超时
    location /api/transcribe {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://meetmind_capture_backend;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /_next/static {
        proxy_pass http://meetmind_capture_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meetmind_capture_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

server {
    listen 8443 ssl;
    server_name capture.meetmind.online;

    ssl_certificate /etc/letsencrypt/live/capture.meetmind.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/capture.meetmind.online/privkey.pem;

    location /api/asr-stream {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location /api/tutor-call {
        proxy_pass http://meetmind_capture_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
