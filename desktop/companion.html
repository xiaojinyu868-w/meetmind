<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <link rel="stylesheet" href="./companion.css">
  <title>MeetMind Buddy</title>
</head>
<body>
  <div id="dock" data-open="false">
    <button type="button" data-act="ask" aria-label="问同学">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5c-1.2 0-2.4-.25-3.4-.7L4 20.5l1.2-4.2A8.5 8.5 0 1 1 21 11.5z"/></svg>
      <span>问</span>
    </button>
    <button type="button" data-act="listen" aria-label="旁听">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z"/><path d="M15 9a4.2 4.2 0 0 1 0 6"/><path d="M17.5 6.5a8 8 0 0 1 0 11"/></svg>
      <span>旁听</span>
    </button>
    <button type="button" data-act="capture" aria-label="收下这一页">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8.5 7 10 4.5h4L15.5 7"/></svg>
      <span>收下</span>
    </button>
  </div>
  <div id="speech" class="speech" data-visible="false"></div>
  <canvas id="stage"></canvas>
  <script src="./companion.js"></script>
</body>
</html>
