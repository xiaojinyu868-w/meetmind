<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MeetMind · 能力看板</title>
<link rel="stylesheet" href="../v7/tokens.css" />
<style>
  body { background: var(--paper); }

  .board {
    max-width: 1440px;
    margin: 0 auto;
    padding: 26px 32px 22px;
  }

  /* ===== 顶栏 ===== */
  .board-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 14px;
  }
  .board-head .left { display: flex; align-items: baseline; gap: 16px; }
  .board-head .logo {
    display: flex; align-items: center; gap: 10px;
    font-weight: 700; font-size: 17px; letter-spacing: -0.01em;
  }
  .board-head .logo .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--pine);
    box-shadow: 0 0 0 3px rgba(47,107,85,0.14);
  }
  .board-head .subtitle { font-size: 13px; color: var(--ink-3); }
  .board-head .right {
    display: flex; align-items: center; gap: 14px;
    font-family: var(--font-mono); font-size: 11px; color: var(--ink-3);
  }

  /* ===== 工作规则条 ===== */
  .rules {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    margin-bottom: 14px;
  }
  .rule {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    padding: 12px 16px;
    display: flex; align-items: baseline; gap: 10px;
    font-size: 12.5px;
  }
  .rule .no {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--vermilion); font-weight: 600;
  }
  .rule .t { font-weight: 600; color: var(--ink); white-space: nowrap; }
  .rule .d { color: var(--ink-3); font-size: 11.5px; }

  /* ===== 台账 ===== */
  .ledger-panel {
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }
  .ledger-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 13px 20px 10px;
    border-bottom: 1px solid var(--rule);
  }
  .ledger-head .t { font-size: 13px; font-weight: 600; }
  .ledger-head .n { font-family: var(--font-mono); font-size: 10px; color: var(--ink-3); }

  table.ledger { width: 100%; border-collapse: collapse; }
  .ledger th {
    font-family: var(--font-mono); font-size: 9.5px;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-4); font-weight: 500;
    text-align: left;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--rule);
  }
  .ledger td {
    padding: 10px 16px;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 12px; vertical-align: top; line-height: 1.5;
  }
  .ledger tbody tr:last-child td { border-bottom: none; }
  .ledger tbody tr { transition: background var(--duration-fast); }
  .ledger tbody tr:hover { background: var(--paper-warm); }

  .asset-name {
    font-weight: 600; color: var(--ink); white-space: nowrap;
    display: flex; align-items: baseline; gap: 8px;
  }
  .asset-name .no {
    font-family: var(--font-mono); font-size: 10px;
    color: var(--pine); font-weight: 600;
  }
  .asset-desc { color: var(--ink-2); }
  .asset-usage { color: var(--ink); }
  .asset-usage::before {
    content: '';
    display: inline-block;
    width: 4px; height: 4px; border-radius: 1px;
    background: var(--vermilion);
    margin-right: 7px; vertical-align: 2px;
  }
  .asset-count {
    font-family: var(--font-mono); font-size: 10.5px;
    color: var(--pine-deep); white-space: nowrap;
    display: block;
  }
  .asset-src {
    font-family: var(--font-mono); font-size: 9.5px;
    color: var(--ink-4); white-space: nowrap;
    display: block; margin-top: 3px;
  }

  /* ===== 页脚 ===== */
  .board-foot {
    margin-top: 12px;
    display: flex; justify-content: space-between; align-items: center;
    font-size: 11px; color: var(--ink-4);
  }
  .board-foot .mono { font-size: 10px; }
  .board-foot a {
    color: var(--ink-3); font-size: 11px;
    border-bottom: 1px solid var(--rule);
    transition: color var(--duration-fast);
  }
  .board-foot a:hover { color: var(--pine); }

  #loadError {
    padding: 40px; text-align: center; color: var(--ink-3); font-size: 13px;
  }
</style>
</head>
<body>

<div class="board" id="root" style="display:none">

  <!-- ===== 顶栏 ===== -->
  <div class="board-head">
    <div class="left">
      <div class="logo"><span class="dot"></span>MeetMind 能力看板</div>
      <div class="subtitle">开发新功能前，先查这份清单</div>
    </div>
    <div class="right">
      <span id="generatedAt"></span>
      <span class="mono">make ledger</span>
    </div>
  </div>

  <!-- ===== 工作规则 ===== -->
  <div class="rules">
    <div class="rule">
      <span class="no">R1</span>
      <span class="t">不复用，不动手</span>
      <span class="d">写新代码前，先确认清单里没有现成能力</span>
    </div>
    <div class="rule">
      <span class="no">R2</span>
      <span class="t">交付必沉淀</span>
      <span class="d">每次交付除产品外，必须留下可复用资产或文档</span>
    </div>
    <div class="rule">
      <span class="no">R3</span>
      <span class="t">二次复用即登记</span>
      <span class="d">能力被第二个使用方复用后，登记进台账</span>
    </div>
  </div>

  <!-- ===== 能力台账 ===== -->
  <div class="ledger-panel">
    <div class="ledger-head">
      <span class="t">可复用能力台账</span>
      <span class="n" id="assetCount"></span>
    </div>
    <table class="ledger">
      <thead>
        <tr>
          <th style="width: 13%;">能力</th>
          <th style="width: 30%;">它能做什么</th>
          <th style="width: 38%;">怎么用</th>
          <th style="width: 19%;">已复用于</th>
        </tr>
      </thead>
      <tbody id="assets"></tbody>
    </table>
  </div>

  <div class="board-foot">
    <span><a href="./strata.html">交付 → 沉淀记录</a></span>
    <span class="mono" id="footSources"></span>
  </div>

</div>

<div id="loadError" style="display:none">
  无法读取 ledger.json —— 请先运行 npx tsx scripts/capability-ledger.ts，并通过 HTTP 访问本页
</div>

<script>
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

fetch('./ledger.json')
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((data) => {
    document.getElementById('root').style.display = '';

    const d = new Date(data.generatedAt);
    document.getElementById('generatedAt').textContent =
      `更新于 ${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

    document.getElementById('assetCount').textContent = `${data.assets.length} 项`;
    const tbody = document.getElementById('assets');
    data.assets.forEach((a) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="asset-name"><span class="no">${CIRCLED[a.no - 1]}</span>${a.name}</span></td>
        <td class="asset-desc">${a.desc}</td>
        <td class="asset-usage">${a.usage}</td>
        <td><span class="asset-count">${a.count}</span><span class="asset-src">${a.source}</span></td>`;
      tbody.appendChild(tr);
    });

    document.getElementById('footSources').textContent =
      `采集自 ${data.sources.collectedFrom.join(' · ')}`;
  })
  .catch(() => {
    document.getElementById('loadError').style.display = '';
  });
</script>

</body>
</html>
