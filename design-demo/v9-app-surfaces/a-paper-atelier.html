<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方向 A · 纸光工作室 — 收集空态</title>
<style>
  @font-face { font-family: 'Inter'; src: url('../../public/fonts/inter-var-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../public/fonts/instrument-serif-400.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../public/fonts/instrument-serif-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../public/fonts/jetbrains-mono-var-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

  :root {
    --paper: #f5f3ec;
    --card: #fffefb;
    --ink: #151a16;
    --ink-2: #4d564f;
    --ink-3: #8b9188;
    --line: #e6e3d7;
    --pine: #2f6b55;
    --pine-mist: #e7efe9;
    --vermilion: #d9532f;
    --serif: 'Instrument Serif', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 顶部晨光：一束很淡的暖光从上方落下来 */
  .light {
    position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% -8%, rgba(255, 253, 246, 0.95) 0%, rgba(255, 253, 246, 0) 70%),
      radial-gradient(38% 30% at 82% 12%, rgba(47, 107, 85, 0.05) 0%, transparent 70%),
      radial-gradient(34% 28% at 14% 20%, rgba(217, 83, 47, 0.04) 0%, transparent 70%);
  }
  /* 纸纹 */
  .grain {
    position: fixed; inset: 0; pointer-events: none; opacity: 0.05; z-index: 1;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .stage {
    position: relative; z-index: 2;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 11vh 24px 160px;
  }

  /* ── 入场编排：先 Octo，再标题，再卡片 ── */
  @keyframes rise {
    from { opacity: 0; transform: translateY(26px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .rise { opacity: 0; animation: rise 0.9s var(--ease-out) forwards; }
  .d1 { animation-delay: 0.05s; } .d2 { animation-delay: 0.18s; }
  .d3 { animation-delay: 0.32s; } .d4 { animation-delay: 0.46s; }
  .d5 { animation-delay: 0.56s; } .d6 { animation-delay: 0.64s; }
  .d7 { animation-delay: 0.72s; } .d8 { animation-delay: 0.82s; }

  .octo {
    width: 92px; height: 92px;
    filter: drop-shadow(0 14px 22px rgba(21, 26, 22, 0.14));
    animation: rise 0.9s var(--ease-out) forwards, bob 5.5s ease-in-out 1s infinite;
  }
  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-7px); }
  }

  .eyebrow {
    margin-top: 26px;
    display: inline-flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 600;
    letter-spacing: 0.22em; text-transform: uppercase; color: var(--pine);
  }
  .eyebrow::before { content: ''; width: 6px; height: 6px; border-radius: 2px; background: var(--vermilion); }

  h1 {
    margin-top: 18px;
    font-size: clamp(34px, 4.6vw, 54px);
    font-weight: 650; letter-spacing: -0.01em; line-height: 1.22;
    text-align: center;
  }
  h1 em {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    color: var(--vermilion); letter-spacing: 0;
    padding: 0 0.06em;
  }

  .sub {
    margin-top: 16px; max-width: 34em;
    font-size: 14.5px; line-height: 1.9; color: var(--ink-2); text-align: center;
  }

  /* ── 四张入口卡：纸感砖 ── */
  .cards {
    margin-top: 48px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
    width: min(880px, 100%);
  }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    padding: 22px 20px 20px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    cursor: pointer; text-align: left;
    box-shadow: 0 1px 2px rgba(21,26,22,0.03), 0 6px 16px rgba(21,26,22,0.04);
    transition: transform 0.35s var(--ease-out), box-shadow 0.35s var(--ease-out), border-color 0.35s;
    overflow: hidden;
  }
  /* hover 时顶部扫过一道松绿 */
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: var(--pine);
    transform: scaleX(0); transform-origin: left;
    transition: transform 0.45s var(--ease-out);
  }
  .card:hover { transform: translateY(-4px); border-color: #d8d4c4;
    box-shadow: 0 2px 4px rgba(21,26,22,0.04), 0 16px 32px rgba(21,26,22,0.08); }
  .card:hover::before { transform: scaleX(1); }
  .card:active { transform: translateY(-1px) scale(0.985); transition-duration: 0.12s; }

  .icon {
    width: 38px; height: 38px; border-radius: 12px;
    display: grid; place-items: center;
    background: var(--pine-mist); color: var(--pine);
    transition: background 0.3s, transform 0.35s var(--ease-out);
  }
  .card:hover .icon { transform: translateY(-2px) rotate(-4deg); }
  .icon svg { width: 18px; height: 18px; }

  .card b { font-size: 14.5px; font-weight: 650; letter-spacing: 0.01em; }
  .card span { font-size: 11.5px; line-height: 1.6; color: var(--ink-3); }

  .wechat {
    margin-top: 30px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3);
  }

  /* ── 底部 composer：悬浮胶囊 ── */
  .composer {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    width: min(680px, calc(100% - 48px));
    display: flex; align-items: center; gap: 10px;
    padding: 8px 8px 8px 20px;
    background: rgba(255, 254, 251, 0.9);
    backdrop-filter: blur(12px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 2px 6px rgba(21,26,22,0.05), 0 18px 44px rgba(21,26,22,0.09);
    transition: box-shadow 0.35s var(--ease-out), border-color 0.35s, transform 0.35s var(--ease-out);
    z-index: 10;
  }
  .composer:focus-within {
    border-color: rgba(47,107,85,0.45);
    transform: translateX(-50%) translateY(-2px);
    box-shadow: 0 0 0 4px rgba(47,107,85,0.08), 0 2px 6px rgba(21,26,22,0.05), 0 20px 48px rgba(21,26,22,0.11);
  }
  .composer input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .composer input::placeholder { color: var(--ink-3); }
  .composer .round {
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    display: grid; place-items: center;
    background: var(--paper); color: var(--ink-2);
    transition: background 0.25s, transform 0.25s var(--ease-out);
  }
  .composer .round:hover { background: var(--pine-mist); transform: scale(1.06); }
  .composer .send { background: var(--ink); color: #fff; }
  .composer .send:hover { background: var(--pine); }
  .composer .round svg { width: 16px; height: 16px; }

  @media (max-width: 720px) {
    .cards { grid-template-columns: repeat(2, 1fr); }
    .stage { padding-top: 8vh; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div class="light"></div>
<div class="grain"></div>

<main class="stage">
  <img class="octo" src="../../public/images/octo-buddy/excited.png" alt="Octo" />
  <p class="eyebrow rise d2">MeetMind · 收集</p>
  <h1 class="rise d3">想到什么，<em>就留在这里。</em></h1>
  <p class="sub rise d4">不用分类，不用打标签。同学会在后台把它接回相关的课堂、目标和问题。</p>

  <div class="cards">
    <button class="card rise d5">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <b>上传</b><span>文件、音频、视频、图片</span>
    </button>
    <button class="card rise d6">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
      <b>链接</b><span>贴个网页或视频链接</span>
    </button>
    <button class="card rise d7">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
      <b>写一句</b><span>想法、困惑、随手记</span>
    </button>
    <button class="card rise d8">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>
      <b>录一段</b><span>语音直接留下来</span>
    </button>
  </div>

  <p class="wechat rise d8">也可以从微信直接发给我</p>
</main>

<div class="composer">
  <input placeholder="发一句想法，贴个链接，或者先把这节课丢进来" />
  <button class="round" aria-label="附件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <button class="round" aria-label="语音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></button>
  <button class="round send" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
</div>
</body>
</html>
