<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方向 C · 手账批注 — 收集空态</title>
<style>
  @font-face { font-family: 'Inter'; src: url('../../public/fonts/inter-var-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('../../public/fonts/instrument-serif-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'JetBrains Mono'; src: url('../../public/fonts/jetbrains-mono-var-latin.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

  :root {
    --paper: #faf8f1;
    --note: #fffdf6;
    --ink: #1a1d18;
    --ink-2: #565c50;
    --ink-3: #94998c;
    --pine: #2f6b55;
    --vermilion: #d9532f;
    --tape: rgba(47, 107, 85, 0.14);
    --serif: 'Instrument Serif', Georgia, serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', 'PingFang SC', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    color: var(--ink);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    /* 横格笔记本纸 */
    background:
      linear-gradient(90deg, transparent 0 72px, rgba(217, 83, 47, 0.14) 72px 73px, transparent 73px),
      repeating-linear-gradient(180deg, transparent 0 31px, rgba(47, 107, 85, 0.055) 31px 32px),
      var(--paper);
  }

  .stage {
    position: relative;
    min-height: 100vh;
    max-width: 880px; margin: 0 auto;
    padding: 9vh 24px 170px 96px;
  }

  /* 页边批注 */
  .margin-note {
    position: absolute; left: 8px; top: 12vh;
    writing-mode: vertical-rl;
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.28em;
    color: var(--ink-3); text-transform: uppercase;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(22px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .rise { opacity: 0; animation: rise 0.85s var(--ease-out) forwards; }
  .d1 { animation-delay: 0.08s; } .d2 { animation-delay: 0.22s; }
  .d3 { animation-delay: 0.38s; } .d4 { animation-delay: 0.52s; }
  .d5 { animation-delay: 0.62s; } .d6 { animation-delay: 0.7s; }
  .d7 { animation-delay: 0.78s; } .d8 { animation-delay: 0.88s; }

  .date-row {
    display: flex; align-items: center; gap: 12px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; color: var(--ink-3);
  }
  .date-row::after { content: ''; flex: 0 0 64px; height: 1px; background: var(--ink-3); opacity: 0.4; }

  h1 {
    margin-top: 22px;
    font-size: clamp(34px, 4.4vw, 52px);
    font-weight: 640; letter-spacing: -0.005em; line-height: 1.3;
  }
  /* 朱砂记号笔下划：画上去 */
  .mark { position: relative; white-space: nowrap; }
  .mark::after {
    content: ''; position: absolute; left: -2%; right: -2%; bottom: 0.04em; height: 0.32em;
    background: rgba(217, 83, 47, 0.24);
    border-radius: 2px;
    transform: scaleX(0); transform-origin: left;
    animation: draw 0.7s var(--ease-out) 0.9s forwards;
    z-index: -1;
  }
  @keyframes draw { to { transform: scaleX(1); } }

  .sub {
    margin-top: 18px; max-width: 38em;
    font-size: 14px; line-height: 2; color: var(--ink-2);
  }
  .sub .q {
    font-family: var(--serif); font-style: italic; color: var(--pine); font-size: 1.06em;
  }

  /* ── 便签入口卡：像四张贴在纸上的便签 ── */
  .cards {
    margin-top: 54px;
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px;
  }
  .card {
    position: relative;
    display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    padding: 26px 18px 18px;
    background: var(--note);
    border: 1px solid rgba(26, 29, 24, 0.08);
    border-radius: 4px 4px 14px 4px;
    cursor: pointer; text-align: left;
    box-shadow: 0 2px 5px rgba(26,29,24,0.05), 0 10px 22px rgba(26,29,24,0.06);
    transition: transform 0.4s var(--ease-out), box-shadow 0.4s var(--ease-out);
  }
  /* 顶部的透明胶带 */
  .card::before {
    content: ''; position: absolute; top: -9px; left: 50%; transform: translateX(-50%) rotate(-1.5deg);
    width: 64px; height: 18px;
    background: var(--tape);
    border-left: 1px dashed rgba(255,255,255,0.5);
    border-right: 1px dashed rgba(255,255,255,0.5);
  }
  .card:nth-child(1) { transform: rotate(-1.1deg); }
  .card:nth-child(2) { transform: rotate(0.7deg); }
  .card:nth-child(3) { transform: rotate(-0.5deg); }
  .card:nth-child(4) { transform: rotate(1.2deg); }
  .card:hover {
    transform: rotate(0deg) translateY(-5px);
    box-shadow: 0 4px 8px rgba(26,29,24,0.06), 0 18px 36px rgba(26,29,24,0.1);
  }
  .card:active { transform: scale(0.97); transition-duration: 0.12s; }
  /* hover 时朱砂小手写箭头 */
  .card::after {
    content: '↝'; position: absolute; right: 12px; bottom: 10px;
    font-family: var(--serif); font-size: 18px; color: var(--vermilion);
    opacity: 0; transform: translateX(-6px);
    transition: opacity 0.3s, transform 0.35s var(--ease-out);
  }
  .card:hover::after { opacity: 1; transform: translateX(0); }

  .icon { color: var(--pine); }
  .icon svg { width: 21px; height: 21px; }
  .card b { font-size: 15px; font-weight: 640; }
  .card span { font-size: 11.5px; line-height: 1.65; color: var(--ink-3); }

  .wechat {
    margin-top: 44px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--ink-3);
  }
  .wechat i {
    font-family: var(--serif); font-style: italic; color: var(--vermilion); font-size: 13px;
    margin-right: 6px;
  }

  /* Octo 邮戳 */
  .octo-stamp {
    position: absolute; right: 4px; top: 9vh;
    width: 84px; height: 84px; border-radius: 50%;
    border: 1.5px dashed rgba(47,107,85,0.45);
    display: grid; place-items: center;
    transform: rotate(8deg);
    background: rgba(255,253,246,0.7);
  }
  .octo-stamp img { width: 58px; height: 58px; }

  /* composer：压在纸上的纸条 */
  .composer {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) rotate(-0.4deg);
    width: min(680px, calc(100% - 48px));
    display: flex; align-items: center; gap: 10px;
    padding: 10px 10px 10px 20px;
    background: var(--note);
    border: 1px solid rgba(26,29,24,0.1);
    border-radius: 6px;
    box-shadow: 0 3px 8px rgba(26,29,24,0.06), 0 16px 40px rgba(26,29,24,0.1);
    transition: box-shadow 0.35s var(--ease-out), transform 0.35s var(--ease-out);
    z-index: 10;
  }
  .composer:focus-within {
    transform: translateX(-50%) rotate(0deg) translateY(-2px);
    box-shadow: 0 0 0 3px rgba(47,107,85,0.12), 0 20px 48px rgba(26,29,24,0.12);
  }
  .composer input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 14px; color: var(--ink); font-family: inherit;
  }
  .composer input::placeholder { color: var(--ink-3); }
  .composer .round {
    width: 34px; height: 34px; border-radius: 8px; border: none; cursor: pointer;
    display: grid; place-items: center;
    background: transparent; color: var(--ink-2);
    transition: background 0.25s, transform 0.25s var(--ease-out);
  }
  .composer .round:hover { background: rgba(47,107,85,0.1); transform: scale(1.06); }
  .composer .send { background: var(--pine); color: #fff; border-radius: 6px; }
  .composer .send:hover { background: #265844; }
  .composer .round svg { width: 16px; height: 16px; }

  @media (max-width: 720px) {
    .stage { padding-left: 40px; }
    .margin-note { display: none; }
    .cards { grid-template-columns: repeat(2, 1fr); }
    .octo-stamp { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    .mark::after { transform: scaleX(1); }
  }
</style>
</head>
<body>
<main class="stage">
  <span class="margin-note">MeetMind · collect</span>

  <div class="octo-stamp rise d1">
    <img src="../../public/images/octo-buddy/happy.png" alt="Octo" />
  </div>

  <p class="date-row rise d2">今天 · 收集页 · NO.001</p>

  <h1 class="rise d3">想到什么，<span class="mark">就留在这里</span>。</h1>
  <p class="sub rise d4">不用分类，不用打标签。<span class="q">同学会在后台把它接回相关的课堂、目标和问题。</span></p>

  <div class="cards">
    <button class="card rise d5">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>
      <b>上传</b><span>文件、音频、视频、图片</span>
    </button>
    <button class="card rise d6">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg></span>
      <b>链接</b><span>贴个网页或视频链接</span>
    </button>
    <button class="card rise d7">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></span>
      <b>写一句</b><span>想法、困惑、随手记</span>
    </button>
    <button class="card rise d8">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></span>
      <b>录一段</b><span>语音直接留下来</span>
    </button>
  </div>

  <p class="wechat rise d8"><i>p.s.</i>也可以从微信直接发给我</p>
</main>

<div class="composer">
  <input placeholder="发一句想法，贴个链接，或者先把这节课丢进来" />
  <button class="round" aria-label="附件"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
  <button class="round" aria-label="语音"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/></svg></button>
  <button class="round send" aria-label="发送"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
</div>
</body>
</html>
