<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MeetMind · 整理中过渡态</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script>
tailwind.config = { theme: { extend: {
  colors: {
    pine: '#2D4F3E', 'pine-mist': '#E8F0EC',
    vermilion: '#B5483C',
    paper: '#FAF7F2', 'paper-warm': '#F2EDE3',
    ink: '#1C1B19', 'ink-muted': '#8C887F',
    canvas: '#F5F1EA', divider: '#E8E2D5',
  },
  fontFamily: {
    sans: ['Inter', 'sans-serif'],
    serif: ['Instrument Serif', 'serif'],
    mono: ['JetBrains Mono', 'monospace'],
  }
}}}
</script>
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; background: #1a1a1a; }
  .phone-frame {
    width: 390px; height: 844px; background: #FAF7F2;
    border-radius: 44px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 12px #2a2a2a, 0 0 0 13px #3a3a3a, 0 40px 80px rgba(0,0,0,0.5);
  }

  @keyframes octo-breath { 0%,100%{transform:scale(1)} 50%{transform:scale(1.05)} }
  .octo-breath { animation: octo-breath 2.5s ease-in-out infinite; }

  @keyframes orbit {
    from { transform: rotate(0deg) translateX(60px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(60px) rotate(-360deg); }
  }
  .orbit-dot { animation: orbit 3s linear infinite; }

  @keyframes orbit-2 {
    from { transform: rotate(120deg) translateX(48px) rotate(-120deg); }
    to   { transform: rotate(480deg) translateX(48px) rotate(-480deg); }
  }
  .orbit-dot-2 { animation: orbit-2 4s linear infinite; }

  @keyframes orbit-3 {
    from { transform: rotate(240deg) translateX(72px) rotate(-240deg); }
    to   { transform: rotate(600deg) translateX(72px) rotate(-600deg); }
  }
  .orbit-dot-3 { animation: orbit-3 5s linear infinite; }

  @keyframes pulse-ring {
    0% { transform: scale(0.8); opacity: 0.6; }
    100% { transform: scale(2.2); opacity: 0; }
  }
  .pulse-ring { animation: pulse-ring 2s ease-out infinite; }

  @keyframes text-fade {
    0%, 40% { opacity: 0; }
    50%, 90% { opacity: 1; }
    100% { opacity: 0; }
  }
  .text-step-1 { animation: text-fade 3s ease-in-out infinite; }
  .text-step-2 { animation: text-fade 3s ease-in-out 1s infinite; }
  .text-step-3 { animation: text-fade 3s ease-in-out 2s infinite; }

  @keyframes card-settle {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card-settle { animation: card-settle 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both; }
</style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

<div class="phone-frame flex flex-col bg-paper items-center justify-center relative overflow-hidden">

  <!-- Pulse rings emanating from center -->
  <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
    <div class="absolute w-32 h-32 rounded-full border border-pine/20 pulse-ring"></div>
    <div class="absolute w-32 h-32 rounded-full border border-pine/15 pulse-ring" style="animation-delay: 0.7s"></div>
    <div class="absolute w-32 h-32 rounded-full border border-pine/10 pulse-ring" style="animation-delay: 1.4s"></div>
  </div>

  <!-- Central Octo -->
  <div class="relative flex items-center justify-center mb-8">
    <!-- Orbiting dots -->
    <div class="absolute w-2 h-2 rounded-full bg-pine orbit-dot"></div>
    <div class="absolute w-1.5 h-1.5 rounded-full bg-vermilion orbit-dot-2"></div>
    <div class="absolute w-1.5 h-1.5 rounded-full bg-pine/60 orbit-dot-3"></div>

    <!-- Octo avatar -->
    <div class="relative h-20 w-20 rounded-full bg-pine-mist flex items-center justify-center octo-breath overflow-hidden">
      <img src="octo/thinking.png" alt="Octo" class="h-full w-full object-cover">
    </div>
  </div>

  <!-- Status text -->
  <div class="text-center px-8 mb-6">
    <p class="font-mono text-[10px] font-semibold uppercase tracking-[0.12em] text-pine mb-2">正在整理</p>
    <h1 class="font-serif text-[24px] leading-[1.2] tracking-[-0.02em] text-ink mb-3">
      把这节课<em class="text-vermilion">听懂</em>
    </h1>
    <!-- Rotating status text -->
    <div class="h-5 relative">
      <p class="text-step-1 absolute inset-0 text-[12.5px] text-ink-muted">正在读转录原文…</p>
      <p class="text-step-2 absolute inset-0 text-[12.5px] text-ink-muted">正在把板书照片插到对应段落…</p>
      <p class="text-step-3 absolute inset-0 text-[12.5px] text-ink-muted">正在生成分段笔记…</p>
    </div>
  </div>

  <!-- Progress dots -->
  <div class="flex items-center gap-2 mb-8">
    <span class="h-1.5 w-1.5 rounded-full bg-pine"></span>
    <span class="h-1 w-1.5 rounded-full bg-pine/40"></span>
    <span class="h-1 w-1.5 rounded-full bg-pine/20"></span>
  </div>

  <!-- Preview card (slowly settling in) -->
  <div class="card-settle w-[300px] rounded-[18px] bg-white border border-divider p-3.5 shadow-soft" style="animation-delay: 2s">
    <div class="flex items-center gap-2 mb-2">
      <span class="font-mono text-[9px] font-semibold text-pine bg-pine-mist px-1.5 py-0.5 rounded">01</span>
      <p class="text-[12px] font-semibold text-ink truncate">梯度下降：下山比喻</p>
    </div>
    <p class="text-[11px] leading-relaxed text-ink-muted">
      老师用下山比喻引入：站在山坡上沿最陡方向走一步，直到谷底…
    </p>
    <div class="mt-2 flex items-center gap-1">
      <span class="font-mono text-[9px] text-pine">02:15</span>
      <span class="h-0.5 flex-1 bg-divider rounded-full"></span>
      <span class="font-mono text-[9px] text-ink-muted">生成中</span>
    </div>
  </div>

  <!-- Hint at bottom -->
  <div class="absolute bottom-[max(env(safe-area-inset-bottom),2rem)] left-0 right-0 text-center">
    <p class="text-[11px] text-ink-muted/60">整理好了会通知你 · 先去做别的也行</p>
  </div>
</div>
</body>
</html>
