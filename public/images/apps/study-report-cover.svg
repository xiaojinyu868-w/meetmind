<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#F7F7F5"/>

  <!-- 左侧：报告卡片 -->
  <rect x="340" y="120" width="240" height="390" rx="20" fill="white" stroke="#E9E9E7" stroke-width="2"/>

  <!-- 顶部橙色条 -->
  <rect x="340" y="120" width="240" height="56" rx="20" fill="#FDF2E9"/>
  <rect x="340" y="156" width="240" height="20" fill="#FDF2E9"/>

  <!-- 橙色圆点 -->
  <circle cx="380" cy="148" r="8" fill="#E67E22" opacity="0.8"/>
  <!-- 标题线条 -->
  <rect x="398" y="140" width="100" height="6" rx="3" fill="#E67E22" opacity="0.5"/>
  <rect x="398" y="152" width="70" height="4" rx="2" fill="#E67E22" opacity="0.3"/>

  <!-- 双环评分 -->
  <circle cx="410" cy="240" r="30" fill="none" stroke="#E9E9E7" stroke-width="5"/>
  <path d="M 410 210 A 30 30 0 1 1 385.86 259.54" fill="none" stroke="#10b981" stroke-width="5" stroke-linecap="round"/>

  <circle cx="510" cy="240" r="30" fill="none" stroke="#E9E9E7" stroke-width="5"/>
  <path d="M 510 210 A 30 30 0 1 1 510 270" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

  <!-- 标签 -->
  <rect x="390" y="282" width="40" height="10" rx="5" fill="#ECFDF5"/>
  <rect x="490" y="282" width="40" height="10" rx="5" fill="#FFFBEB"/>

  <!-- 内容行 -->
  <rect x="370" y="310" width="180" height="5" rx="2.5" fill="#E9E9E7"/>
  <rect x="370" y="325" width="140" height="5" rx="2.5" fill="#E9E9E7"/>
  <rect x="370" y="340" width="160" height="5" rx="2.5" fill="#E9E9E7"/>

  <!-- 提示卡 -->
  <rect x="370" y="365" width="180" height="44" rx="10" fill="#FDF2E9"/>
  <circle cx="392" cy="387" r="10" fill="#E67E22"/>
  <rect x="412" y="380" width="120" height="5" rx="2.5" fill="#E67E22" opacity="0.35"/>
  <rect x="412" y="391" width="90" height="4" rx="2" fill="#E67E22" opacity="0.2"/>

  <!-- 分隔线 -->
  <rect x="370" y="425" width="180" height="1" fill="#E9E9E7"/>

  <!-- 知识点条 -->
  <rect x="370" y="440" width="180" height="26" rx="8" fill="#F7F7F5"/>
  <rect x="382" y="449" width="80" height="5" rx="2.5" fill="#787774" opacity="0.4"/>
  <rect x="510" y="447" width="30" height="10" rx="5" fill="#ECFDF5"/>

  <rect x="370" y="474" width="180" height="26" rx="8" fill="#F7F7F5"/>
  <rect x="382" y="483" width="100" height="5" rx="2.5" fill="#787774" opacity="0.4"/>
  <rect x="510" y="481" width="30" height="10" rx="5" fill="#FFFBEB"/>

  <!-- 右侧：装饰性大环 -->
  <circle cx="760" cy="315" r="120" fill="none" stroke="#E9E9E7" stroke-width="3"/>
  <path d="M 760 195 A 120 120 0 1 1 660.72 399.54" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <circle cx="760" cy="315" r="85" fill="none" stroke="#E9E9E7" stroke-width="3"/>
  <path d="M 760 230 A 85 85 0 1 1 760 400" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" opacity="0.6"/>

  <!-- 中心数字装饰 -->
  <circle cx="760" cy="315" r="36" fill="#F7F7F5"/>
  <rect x="742" y="305" width="36" height="8" rx="4" fill="#232322" opacity="0.15"/>
  <rect x="748" y="318" width="24" height="5" rx="2.5" fill="#A3A39E" opacity="0.3"/>

  <!-- 右侧标签 -->
  <rect x="700" y="460" width="56" height="20" rx="10" fill="#ECFDF5"/>
  <rect x="766" y="460" width="56" height="20" rx="10" fill="#FFFBEB"/>
</svg>
