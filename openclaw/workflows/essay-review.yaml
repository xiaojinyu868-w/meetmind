# Lobster Workflow: 论文批注

name: essay-review
version: 1.0.0
description: 接收论文 → 结构化批注 → 推送修改建议

steps:
  - id: parse-paper
    type: prompt
    message: |
      解析用户提交的论文内容，提取：
      1. 标题
      2. 各章节（摘要/引言/方法/结果/讨论）
      3. 引用列表
      如果是 PDF，先用 PDF 提取工具转文本。

  - id: structure-check
    type: skill
    skill: thesis-review
    input:
      paper: "{{parse-paper}}"
      depth: "{{input.depth | default: 'deep'}}"

  - id: format-feedback
    type: prompt
    message: |
      将批注结果格式化为用户友好的输出：
      - 按严重程度排序（🔴 > 🟡 > 🟢）
      - 每条批注必须指回原文段落
      - 给出具体改法，不只是指出问题

  - id: push-results
    type: tool
    tool: meetmind-push-task
    input:
      type: thesis-review
      data: "{{format-feedback}}"
