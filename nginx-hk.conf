# MeetMind 香港服务器 Nginx 配置
# 域名: hk.meetmind.online
# 复制此文件到 /etc/nginx/conf.d/meetmind.conf

# ========== 上游服务器 ==========
upstream meetmind_backend {
    server 127.0.0.1:3001;
    keepalive 32;
}

# ========== HTTP 重定向到 HTTPS ==========
server {
    listen 80;
    server_name hk.meetmind.online;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ========== HTTPS 主服务器 (443) ==========
server {
    listen 443 ssl http2;
    server_name hk.meetmind.online;

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/hk.meetmind.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hk.meetmind.online/privkey.pem;

    # SSL 优化
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # 文件上传限制
    client_max_body_size 500M;

    # WebSocket - 实时语音识别
    location /api/asr-stream {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # SSE 流式接口 - AI 对话
    location /api/tutor {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # SSE 流式接口 - Chat
    location /api/chat {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # API 路由 - 通用
    location /api/ {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 视频导入接口 - 长耗时
    location /api/video/import {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 900s;
    }

    # 应用执行接口 - 播客生成等长耗时
    location /api/apps/execute {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }

    # 音频转录接口 - 长耗时
    location /api/transcribe-turbo {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }

    # 长音频异步转写（DashScope qwen3-asr-flash-filetrans）
    # 100 分钟音频需要 10-30 分钟，必须长超时
    location /api/transcribe {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        client_max_body_size 500M;
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        proxy_pass http://meetmind_backend;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Next.js 静态文件
    location /_next/static {
        proxy_pass http://meetmind_backend;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 默认路由
    location / {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

# ========== 8443 WebSocket 备用端口 ==========
server {
    listen 8443 ssl;
    server_name hk.meetmind.online;

    ssl_certificate /etc/letsencrypt/live/hk.meetmind.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hk.meetmind.online/privkey.pem;

    # 只处理 WebSocket 请求
    location /api/asr-stream {
        proxy_pass http://meetmind_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # 其他请求重定向到 443
    location / {
        return 301 https://$host$request_uri;
    }
}
