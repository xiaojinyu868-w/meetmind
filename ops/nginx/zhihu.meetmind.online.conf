# 知乎线独立试用实例 zhihu.meetmind.online → PM2 meetmind-zhihu（127.0.0.1:3012，cwd /mnt/meetmind-zhihu）
# 安装：cp 本文件到 /etc/nginx/conf.d/ && nginx -t && systemctl reload nginx
# 证书：DNS A 记录到位后 `certbot --nginx -d zhihu.meetmind.online`（certbot 会把 443 块与 80→443 跳转写进 /etc/nginx/conf.d 里的这份）
# 与 capture.meetmind.online.conf 同一套反代约定：SSE（teach / tutor / chat）关缓冲、ASR WebSocket 升级、长任务放宽超时

map $http_upgrade $meetmind_zhihu_connection_upgrade {
    default upgrade;
    '' close;
}

upstream meetmind_zhihu_backend {
    server 127.0.0.1:3012;
    keepalive 32;
}

server {
    listen 80;
    server_name zhihu.meetmind.online;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    client_max_body_size 500M;

    # ASR 实时字幕 WebSocket（课堂页里学生开口说话会用到）
    location /api/asr-stream {
        proxy_pass http://meetmind_zhihu_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $meetmind_zhihu_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # SSE：上课舞台事件流、同桌对话、直答式对话——关缓冲，长读超时
    location ~ ^/api/(teach|tutor|chat|fenshen)(/|$) {
        proxy_pass http://meetmind_zhihu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 300s;
    }

    # 长任务：应用矩阵执行、收藏夹导入 / 抽正文 / 开课（Firecrawl + 建课）
    location ~ ^/api/(apps/execute|zhihu/(import|materialize|lesson))(/|$) {
        proxy_pass http://meetmind_zhihu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://meetmind_zhihu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://meetmind_zhihu_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
    }
}
