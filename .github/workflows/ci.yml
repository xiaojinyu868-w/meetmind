name: CI

on:
  pull_request:
    branches: [feature/classroom-v2-hci-polish, main]
  push:
    branches: [milestone/**]

jobs:
  # ──────────────────────────────────────────────────────────────
  # 类型检查 + 单元测试 + Eval Harness
  # ──────────────────────────────────────────────────────────────
  checks:
    name: tsc + tests + eval harness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 把 Prisma generate 的 sqlite 文件写到 tmp
      DATABASE_URL: "file:./tmp-ci.db"
      # LLM judge 在 CI 环境跳过（无 key）
      LOG_LEVEL: info

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Prisma generate
        run: npx prisma generate

      - name: Type check (tsc --noEmit)
        run: make check

      - name: Unit tests (src/)
        run: make test

      - name: Server tests (ASR text utils)
        run: make test-server

      - name: Eval harness unit tests (graders)
        run: make eval-unit

      - name: Run ASR harness (dry-run)
        run: make eval-asr

      - name: Run Tutor harness (dry-run)
        run: make eval-tutor

      - name: Regression guard (baseline check)
        run: make eval-guard
