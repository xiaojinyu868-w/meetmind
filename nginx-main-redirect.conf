# MeetMind 主域名兼容入口
# 正式应用运行在 capture.meetmind.online；旧主域链接永久保留并重定向。
# 前提：meetmind.online 的 DNS 指向本机，且 /etc/letsencrypt/live/meetmind.online/ 已存在。
# 安装：cp nginx-main-redirect.conf /etc/nginx/conf.d/meetmind.conf
# 验证：nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name meetmind.online;

    return 308 https://capture.meetmind.online$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name meetmind.online;

    ssl_certificate /etc/letsencrypt/live/meetmind.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/meetmind.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    return 308 https://capture.meetmind.online$request_uri;
}
